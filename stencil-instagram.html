<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex">
		<meta name="description" content="Stencil — Draw with Guidelines">
		<meta property="og:url" content="https://studionext.co.uk/stencil-instagram">
		<meta property="og:title" content="Stencil — Draw with Guidelines">
		<meta property="og:description" content="Get Stencil on the App Store">
		<title>Stencil — Draw with Guidelines</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #242943;
				color: #fff;
				text-align: center;
			}
			main { padding: 2rem; max-width: 22rem; }
			h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
			p { color: rgba(255, 255, 255, 0.65); line-height: 1.5; }
			.button {
				display: inline-block;
				margin-top: 1.25rem;
				padding: 0.9rem 2rem;
				border-radius: 0.5rem;
				background: #fff;
				color: #242943;
				font-weight: 600;
				text-decoration: none;
			}
			.hint { font-size: 0.8rem; margin-top: 1.5rem; }
		</style>
	</head>
	<body>
		<main>
			<h1>Stencil</h1>
			<p>Taking you to the App&nbsp;Store&hellip;</p>
			<a class="button" id="store-button"
				href="https://apps.apple.com/us/app/stencil-draw-with-guidelines/id1553707162">
				Open the App&nbsp;Store
			</a>
			<p class="hint">If nothing happens, tap <strong>&bull;&bull;&bull;</strong> in the corner
				and choose <strong>Open in external browser</strong>.</p>
		</main>
		<script>
		(function () {
			var APP_STORE_URL = 'https://apps.apple.com/us/app/stencil-draw-with-guidelines/id1553707162';
			// Server-side 302 → instagram://external_browser?url=… — the webview only honors
			// the scheme when it arrives as a redirect Location header, not from script.
			var ESCAPE_URL = 'https://studionext-links.web.app/stencil';
			// Server-side 302 → itms-appss://… — forces the native App Store app.
			var STORE_HOP_URL = 'https://studionext-links.web.app/stencil-appstore';

			var ua = navigator.userAgent || '';
			var inInstagram = /Instagram/i.test(ua);
			var isAndroid = /Android/i.test(ua);

			// Once any attempt succeeds the page loses visibility — later fallbacks must not fire.
			function attempt(url, delay) {
				setTimeout(function () {
					if (document.visibilityState === 'visible') window.location.href = url;
				}, delay);
			}

			if (!inInstagram) {
				window.location.replace(APP_STORE_URL);
				return;
			}

			// A tapped link is the most reliable escape of all, so the button rides the 302 too.
			document.getElementById('store-button').href = ESCAPE_URL;

			attempt(ESCAPE_URL, 0);

			if (isAndroid) {
				attempt(
					'intent://' + APP_STORE_URL.replace(/^https?:\/\//, '') +
					'#Intent;scheme=https;action=android.intent.action.VIEW;' +
					'category=android.intent.category.BROWSABLE;' +
					'S.browser_fallback_url=' + encodeURIComponent(APP_STORE_URL) + ';end',
					1800
				);
			} else {
				attempt(STORE_HOP_URL, 1800);
			}

			attempt(APP_STORE_URL, 3600);
		})();
		</script>
	</body>
</html>
